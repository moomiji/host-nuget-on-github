name: Host NuGet on GitHub
author: moomiji
description: 'Run the sleet, and push the static nuget feed to github.'

branding:
  icon: 'upload-cloud'
  color: 'white'

inputs:
  base-uri:
    description: >
      Specify a URI to write to the feed json files instead of the container's URI.
      Useful if serving up the content from a different endpoint.
    required: true
  package-paths:
    description: 'Relative paths to individual packages or directories containing packages.'
    required: true
  on-sleet-pushed:
    description: 'Bash commands executed on sleet pushed.'
    default: ''
  repository-path:
    description: >
      Relative path under $GITHUB_WORKSPACE/.. to place the nuget feed repository.
      The environment variable $FEED_WORKSPACE is set to its absolute path.
      Useful if specifying a config.
    default: 'GitHub-Hosted'
  feed-path:
    description: '[Relative path under $FEED_WORKSPACE/ to the output directory of the feed.](https://github.com/emgarten/Sleet/blob/main/doc/client-settings.md#folder-feed-specific-properties)'
    default: ''
  config:
    description: '[Relative path to sleet.json where the source information is contained.](https://github.com/emgarten/Sleet/blob/main/doc/commands.md#push)'
    default: 'none'
  force:
    description: '[Overwrite existing packages.](https://github.com/emgarten/Sleet/blob/main/doc/commands.md#push)'
    default: false
  skip-existing:
    description: '[Skip packages that already exist on the feed.](https://github.com/emgarten/Sleet/blob/main/doc/commands.md#push)'
    default: false
  commit-message:
    description: 'Message to use when committing changes.'
    default: '${{ github.repository }}(${{ github.ref_name }})'
  commit-author:
    description: 'Author name and email address in the format `Display Name <email@address.com>`.'
    default: '${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>'
  commit-user-name:
    description: 'User name of the commiter.'
    default: 'github-actions[bot]'
  commit-user-email:
    description: >
      User email address of the commiter ( {user.id}+{user.login}@users.noreply.github.com ).
      See [users API](https://api.github.com/users/github-actions%5Bbot%5D).
    default: '41898282+github-actions[bot]@users.noreply.github.com'
  commit-sign:
    description: 'Sign commits use `web-flow.gpg` or `commit-user-gpg-key` of your own bot.'
    default: false
  commit-user-gpg-key:
    description: 'GPG private key of your own bot. Defaults to `web-flow.gpg`.'
    default: ''
  commit-user-gpg-passphrase:
    description: 'Passphrase of the GPG key.'
    default: ''
  squash:
    description: 'Indicate whether to squash all commits of the branch.'
    default: false
  repository:
    description: 'Repository name with owner. For example, actions/checkout'
  branch:
    description: 'The branch name. Otherwise, uses the default branch.'
  token:
    description: 'Personal access token (PAT) used to fetch and push the repository.'
    default: ${{ github.token }}
  lfs:
    description: 'Whether to download Git-LFS files.'
    default: false

outputs:
  feed-uri:
    description: "Full uri of the feed's root."
    value: ${{ steps.verify.outputs.feed-uri }}

runs:
  using: "composite"
  steps:
    -
      uses: actions/setup-dotnet@v5
    -
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        repository: ${{ inputs.repository }}
        token: ${{ inputs.token }}
        path: ${{ inputs.repository-path }}
        lfs: ${{ inputs.lfs }}
    -
      id: verify
      shell: bash
      env:
        SLEET_FEED_BASEURI: ${{ inputs.base-uri }}
      run: |
        TARGET_PATH="../${{ inputs.repository-path }}"
        if [ -d "$TARGET_PATH" ]; then
          echo -e "\033[33m Warning: Target path already exists at $TARGET_PATH, removing it \033[0m"
          rm -rf "$TARGET_PATH"
        fi
        mv "${{ inputs.repository-path }}" ../
        cd "$TARGET_PATH" || exit 1
        
        echo -e "\033[32m Checking branch state for ${{ inputs.branch }} \033[0m"
        if git rev-parse --verify origin/${{ inputs.branch }} >/dev/null 2>&1; then
          echo -e "\033[32m Branch exists on remote: ${{ inputs.branch }} \033[0m"
          if ${{ inputs.squash }}; then
            echo "exist-branch=squash" | tee -a $GITHUB_OUTPUT
            # Validate local and remote are in sync before squash
            git fetch origin ${{ inputs.branch }}
            git checkout ${{ inputs.branch }}
            git checkout --orphan temp-${{ inputs.branch }}
            git branch -d ${{ inputs.branch }}
            git branch -m ${{ inputs.branch }}
          else
            echo "exist-branch=true" | tee -a $GITHUB_OUTPUT
            git checkout ${{ inputs.branch }}
          fi
        else
          echo "exist-branch=false" | tee -a $GITHUB_OUTPUT
          echo -e "\033[32m Creating orphan branch: ${{ inputs.branch }} \033[0m"
          git checkout --orphan ${{ inputs.branch }}
          git rm -rf .
        fi

        cd "${GITHUB_WORKSPACE}/../${{ inputs.repository-path }}" || exit 1
        FEED_WORKSPACE_PATH="$(pwd)"
        echo "feed-workspace=$FEED_WORKSPACE_PATH" | tee -a $GITHUB_OUTPUT
        echo -e "\033[32m Feed workspace initialized: $FEED_WORKSPACE_PATH \033[0m"

        FEED_URI="${SLEET_FEED_BASEURI%/}/index.json"
        echo "feed-uri=$FEED_URI" | tee -a $GITHUB_OUTPUT
        echo -e "\033[32m Feed URI: $FEED_URI \033[0m"
    -
      shell: bash
      env:
        PACKAGE_PATHS: ${{ inputs.package-paths }}
        SLEET_FEED_TYPE: local
        SLEET_FEED_BASEURI: ${{ inputs.base-uri }}
        SLEET_FEED_PATH: ${{ steps.verify.outputs.feed-workspace }}/${{ inputs.feed-path }}
        FEED_WORKSPACE: ${{ steps.verify.outputs.feed-workspace }}
      run: |
        echo -e "\033[32m Installing sleet tool... \033[0m"
        dotnet tool install -g sleet
        echo -e "\033[32m Sleet installation completed \033[0m"
        
        echo -e "\033[32m Pushing packages to NuGet feed... \033[0m"
        echo -e "\033[32m Package paths: ${PACKAGE_PATHS} \033[0m"
        echo -e "\033[32m Feed path: ${SLEET_FEED_PATH} \033[0m"
        echo -e "\033[32m Feed base URI: ${SLEET_FEED_BASEURI} \033[0m"
        
        # Explicit error handling for sleet push
        SLEET_EXIT_CODE=0
        sleet push ${PACKAGE_PATHS} \
          ${{ inputs.force && '--force' || '' }} \
          ${{ inputs.skip-existing && '--skip-existing' || '' }} \
          --config ${{ inputs.config }} || SLEET_EXIT_CODE=$?
        
        if [ "$SLEET_EXIT_CODE" -ne 0 ]; then
          echo -e "\033[31m ERROR: sleet push command failed with exit code $SLEET_EXIT_CODE \033[0m"
          exit $SLEET_EXIT_CODE
        fi

        echo -e "\033[32m Packages pushed successfully to feed \033[0m"
    -
      shell: bash
      env:
        SLEET_FEED_TYPE: local
        SLEET_FEED_BASEURI: ${{ inputs.base-uri }}
        SLEET_FEED_PATH: ${{ steps.verify.outputs.feed-workspace }}/${{ inputs.feed-path }}
        FEED_WORKSPACE: ${{ steps.verify.outputs.feed-workspace }}
      run: |
        echo -e "\033[32m Executing on-sleet-pushed hooks... \033[0m"
        if [ -n "${{ inputs.on-sleet-pushed }}" ]; then
          ${{ inputs.on-sleet-pushed }}
          echo -e "\033[32m on-sleet-pushed hooks completed \033[0m"
        else
          echo -e "\033[32m No on-sleet-pushed hooks specified \033[0m"
        fi
    -
      if: inputs.commit-sign == 'true' && inputs.commit-user-gpg-key != ''
      id: gpg
      uses: crazy-max/ghaction-import-gpg@v7
      with:
        workdir: ${{ steps.verify.outputs.feed-workspace }}
        gpg_private_key: ${{ inputs.commit-user-gpg-key }}
        passphrase: ${{ inputs.commit-user-gpg-passphrase }}
        git_user_signingkey: true
        git_commit_gpgsign: true
    -
      shell: bash
      run: |
        cd "${{ steps.verify.outputs.feed-workspace }}" || exit 1
        echo -e "\033[32m Configuring git user... \033[0m"
        git config --local user.name "${{ inputs.commit-user-name }}"
        git config --local user.email "${{ inputs.commit-user-email }}"
        
        echo -e "\033[32m Staging changes for commit... \033[0m"
        git add .
        CHANGES=$(git status --short | wc -l)
        echo -e "\033[32m Number of changed files: $CHANGES \033[0m"
        
        if [ "$CHANGES" -gt 0 ]; then
          echo -e "\033[32m Creating commit... \033[0m"
          git commit \
            -m "${{ inputs.commit-message }}" \
            -m "- sha: ${{ github.sha }}" \
            -m "- run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --author="${{ inputs.commit-author }}" \
            ${{ steps.gpg.outputs.keyid != '' && '-S' || '' }}
          echo -e "\033[32m Commit created successfully \033[0m"
        else
          echo -e "\033[32m No changes to commit \033[0m"
        fi
        
        if ${{ steps.verify.outputs.exist-branch == 'squash' }}; then
          echo -e "\033[32m Setting upstream branch for squash mode... \033[0m"
          git branch --set-upstream-to=origin/${{ inputs.branch }}
        fi
        if ${{ steps.verify.outputs.exist-branch == 'true' }}; then
          echo -e "\033[32m Pulling and rebasing from remote branch... \033[0m"
          git pull origin ${{ inputs.branch }} --rebase
        fi
    -
      uses: ad-m/github-push-action@v1
      with:
        repository: ${{ inputs.repository }}
        branch: ${{ inputs.branch }}
        github_token: ${{ inputs.token }}
        directory: ${{ steps.verify.outputs.feed-workspace }}
        force_with_lease: ${{ steps.verify.outputs.exist-branch == 'squash' }}
    -
      id: validate
      shell: bash
      run: |
        # Verify output integrity and feed accessibility
        echo -e "\033[32m Validating action outputs... \033[0m"
        
        # Verify feed-uri output is set
        FEED_URI="${{ steps.verify.outputs.feed-uri }}"
        if [ -z "$FEED_URI" ]; then
          echo -e "\033[31m ERROR: feed-uri output is empty \033[0m"
          exit 1
        fi
        
        # Validate feed-uri format (should be a valid URI)
        if ! [[ "$FEED_URI" =~ ^https?:// ]]; then
          echo -e "\033[33m WARNING: feed-uri does not start with http:// or https:// \033[0m"
          echo -e "\033[34m Feed URI: $FEED_URI \033[0m"
        else
          echo -e "\033[32m ✓ Feed URI format validated: $FEED_URI \033[0m"
        fi
        
        # Verify feed-workspace path exists and was created successfully
        FEED_WORKSPACE="${{ steps.verify.outputs.feed-workspace }}"
        if [ ! -d "$FEED_WORKSPACE" ]; then
          echo -e "\033[33m WARNING: feed-workspace directory was cleaned up (expected if using orphan branch) \033[0m"
        else
          echo -e "\033[32m ✓ Feed workspace exists: $FEED_WORKSPACE \033[0m"
          # Count the number of files in the feed
          FILE_COUNT=$(find "$FEED_WORKSPACE" -type f | wc -l)
          echo -e "\033[32m   Files in feed: $FILE_COUNT \033[0m"
        fi
        
        echo -e "\033[32m Output validation completed successfully \033[0m"
    -
      if: always()
      shell: bash
      run: rm -rf ${{ steps.verify.outputs.feed-workspace }}
